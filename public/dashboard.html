<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jump Up Events — Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"></div>

<script>
const API = window.location.origin;

async function fetchAPI(path) {
  try {
    const res = await fetch(API + path);
    if (res.status === 401) { renderLogin(); return null; }
    if (res.status === 403) { renderForbidden(); return null; }
    return await res.json();
  } catch {
    renderLogin();
    return null;
  }
}

async function init() {
  const me = await fetchAPI('/api/me');
  if (!me) return;
  renderDashboard(me);
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-prompt">
      <img src="https://media.discordapp.net/attachments/1529062834250715182/1529396105702539414/icon-1.png" alt="Jump Up Events">
      <h1>Jump Up Events</h1>
      <p>Staff moderation panel. Log in with your Discord account to manage the server.</p>
      <a href="/auth/discord" class="btn btn-primary">Login with Discord</a>
    </div>
  `;
}

function renderForbidden() {
  document.getElementById('app').innerHTML = `
    <div class="login-prompt">
      <img src="https://media.discordapp.net/attachments/1529062834250715182/1529396105702539414/icon-1.png" alt="Jump Up Events">
      <h1>Access Denied</h1>
      <p>You need the admin role in the Jump Up Events server to access this panel.</p>
      <a href="/auth/logout" class="btn btn-danger">Log Out</a>
    </div>
  `;
}

function renderDashboard(me) {
  const avatar = me.avatar
    ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png`
    : `https://cdn.discordapp.com/embed/avatars/${me.id % 5}.png`;

  document.getElementById('app').innerHTML = `
    <nav class="nav">
      <div class="nav-brand">
        <img src="https://media.discordapp.net/attachments/1529062834250715182/1529396105702539414/icon-1.png" alt="Jump Up Events">
        Jump Up Events
      </div>
      <div class="nav-user">
        <span>${me.username}</span>
        <img src="${avatar}" alt="">
        <a href="/auth/logout" class="btn btn-small btn-danger">Logout</a>
      </div>
    </nav>
    <div class="container">
      <div class="tabs">
        <button class="tab active" data-tab="strikes">Strikes</button>
        <button class="tab" data-tab="modmail">Modmail</button>
        <button class="tab" data-tab="actions">Quick Actions</button>
      </div>

      <div id="tab-strikes" class="tab-content active">
        <div class="cards">
          <div class="card">
            <h2>Issue Strike</h2>
            <div class="form-group">
              <label>User ID</label>
              <input type="text" id="strike-user" placeholder="Discord user ID">
            </div>
            <div class="form-group">
              <label>Public Reason</label>
              <input type="text" id="strike-public" placeholder="Reason shown to user">
            </div>
            <div class="form-group">
              <label>Private Reason (staff only)</label>
              <input type="text" id="strike-private" placeholder="Internal notes">
            </div>
            <button class="btn btn-primary" onclick="issueStrike()">Issue Strike</button>
            <div id="strike-alert" style="margin-top:12px"></div>
          </div>
          <div class="card">
            <h2>All Strikes</h2>
            <div id="strike-list"><p style="color:#9d9daf">Click refresh to load.</p></div>
            <button class="btn btn-small btn-primary" style="margin-top:12px" onclick="loadStrikes()">Refresh</button>
          </div>
        </div>
      </div>

      <div id="tab-modmail" class="tab-content">
        <div class="card">
          <h2>Active Tickets</h2>
          <div id="ticket-list"><p style="color:#9d9daf">Click refresh to load tickets.</p></div>
          <button class="btn btn-small btn-primary" style="margin-top:12px" onclick="loadTickets()">Refresh</button>
        </div>
      </div>

      <div id="tab-actions" class="tab-content">
        <div class="cards">
          <div class="card">
            <h2>Look Up User</h2>
            <div class="form-group">
              <label>User ID</label>
              <input type="text" id="lookup-user" placeholder="Discord user ID">
            </div>
            <button class="btn btn-primary" onclick="lookupUser()">Search</button>
            <div id="lookup-result" style="margin-top:12px"></div>
          </div>
          <div class="card">
            <h2>Quick Links</h2>
            <p style="color:#9d9daf;margin-bottom:12px;line-height:1.6">
              Use slash commands in Discord for moderation actions:<br>
              <code>/mstrike</code> · <code>/mkick</code> · <code>/mban</code> · <code>/mmute</code> · <code>/giveaway</code>
            </p>
          </div>
        </div>
      </div>
    </div>
  `;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      if (tab.dataset.tab === 'modmail') loadTickets();
    });
  });

  loadStrikes();
}

async function loadStrikes() {
  const data = await fetchAPI('/api/strikes');
  if (!data) return;
  const el = document.getElementById('strike-list');
  if (data.length === 0) {
    el.innerHTML = '<p style="color:#9d9daf">No strikes recorded.</p>';
    return;
  }
  const rows = data.map(s => {
    const date = new Date(s.timestamp).toLocaleDateString();
    return `<tr>
      <td><div class="user-cell"><span>${s.userId}</span></div></td>
      <td>#${s.id}</td>
      <td>${date}</td>
      <td>${s.publicReason}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>User</th><th>#</th><th>Date</th><th>Reason</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function issueStrike() {
  const userId = document.getElementById('strike-user').value.trim();
  const publicReason = document.getElementById('strike-public').value.trim();
  const privateReason = document.getElementById('strike-private').value.trim();
  const alert = document.getElementById('strike-alert');

  if (!userId || !publicReason) {
    alert.innerHTML = '<div class="alert alert-error">User ID and Public Reason are required.</div>';
    return;
  }

  try {
    const res = await fetch(API + '/api/strikes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, publicReason, privateReason }),
    });
    const data = await res.json();
    if (res.ok) {
      alert.innerHTML = `<div class="alert alert-success">Strike #${data.strikeId} issued.</div>`;
      document.getElementById('strike-user').value = '';
      document.getElementById('strike-public').value = '';
      document.getElementById('strike-private').value = '';
      loadStrikes();
    } else {
      alert.innerHTML = `<div class="alert alert-error">${data.error || 'Failed to issue strike.'}</div>`;
    }
  } catch {
    alert.innerHTML = '<div class="alert alert-error">Network error.</div>';
  }
}

async function lookupUser() {
  const userId = document.getElementById('lookup-user').value.trim();
  const el = document.getElementById('lookup-result');
  if (!userId) {
    el.innerHTML = '<div class="alert alert-error">Enter a user ID.</div>';
    return;
  }
  const data = await fetchAPI('/api/strikes/' + userId);
  if (!data) return;
  if (data.length === 0) {
    el.innerHTML = '<div class="alert alert-success">No strikes for this user.</div>';
    return;
  }
  const rows = data.map(s =>
    `<tr><td>#${s.id}</td><td>${new Date(s.timestamp).toLocaleDateString()}</td><td>${s.publicReason}</td></tr>`
  ).join('');
  el.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>#</th><th>Date</th><th>Reason</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function loadTickets() {
  const data = await fetchAPI('/api/tickets');
  if (!data) return;
  const el = document.getElementById('ticket-list');
  if (data.length === 0) {
    el.innerHTML = '<p style="color:#9d9daf">No active tickets.</p>';
    return;
  }
  const rows = data.map(t => `
    <div class="ticket-item">
      <div class="ticket-info">
        <strong>User:</strong> ${t.userId} &middot; <strong>Mode:</strong> ${t.mode}
      </div>
      <div class="ticket-actions">
        <input type="text" id="reply-${t.userId}" placeholder="Type a reply..." style="flex:1;padding:6px;border-radius:4px;border:1px solid #3b3d4a;background:#1e1f2b;color:#fff">
        <button class="btn btn-small btn-primary" onclick="replyToTicket('${t.userId}')">Reply</button>
        <button class="btn btn-small btn-danger" onclick="closeTicket('${t.userId}')">Close</button>
      </div>
    </div>
  `).join('');
  el.innerHTML = `<div class="ticket-list">${rows}</div>`;
}

async function replyToTicket(userId) {
  const input = document.getElementById('reply-' + userId);
  const message = input.value.trim();
  if (!message) return;
  const res = await fetch(API + '/api/tickets/' + userId + '/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });
  if (res.ok) {
    input.value = '';
    loadTickets();
  }
}

async function closeTicket(userId) {
  if (!confirm('Close this ticket?')) return;
  const res = await fetch(API + '/api/tickets/' + userId + '/close', {
    method: 'POST',
  });
  if (res.ok) loadTickets();
}

init();
</script>
</body>
</html>
